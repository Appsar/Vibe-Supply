<h1 class="flex justify-center text-5xl mb-10">All Products</h1>

<div class="flex gap-10 justify-center">
  @for (product of products(); track product.id) {
    <div class="product-card">
      <img [src]="product.image_url" [alt]="product.name" />
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }}</p>
      <a
        [routerLink]="['/products', product.id]"
        class="inline-block font-bold transition-transform duration-200 hover:scale-125"
        >More details</a
      >
    </div>
  }
</div>

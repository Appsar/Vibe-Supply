<main>
  <a
    routerLink="/products"
    class="flex hover:text-vibe-accent font-display tracking-tight transition-colors ml-5 font-bold rounded-2xl p-2"
    ><svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="#000000"
    >
      <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
    </svg>
    Back to Products</a
  >

  <div class="flex flex-col justify-center items-center gap-4">
    @if (product(); as p) {
      <img [src]="p.image_url" [alt]="p.name" />
      <h3 class="font-display tracking-tight text-3xl">{{ p.name }}</h3>
      <p class="text-3xl">{{ p.price | currency }}</p>
      <p>{{ p.description }}</p>
      <p>{{ 'In stock - ' + p.stock + ' left' }}</p>
      <button
        (click)="cartService.addToCart(p, 1)"
        class="hover:text-vibe-accent border-vibe-accent border-2 rounded-2xl p-2 shadow-2xl hover:scale-105 transition-transform duration-200"
      >
        Add to cart
      </button>
    } @else {
      <p>Loading...</p>
    }
  </div>
</main>

<main>
  <a
    (click)="menuService.close()"
    routerLink="/products"
    class="flex hover:text-vibe-accent sm:ml-0 font-display tracking-tight transition-colors lg:ml-5 font-bold rounded-2xl p-1 lg:p-2"
    ><svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="#000000"
    >
      <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
    </svg>
    Back to Products</a
  >

  <div
    class="flex flex-col justify-center items-center gap-4 sm:mb-5 text-center lg:mb-12 border-b-6 rounded-xl border-vibe-accent"
  >
    @if (product(); as p) {
      <img [src]="p.image_url" [alt]="p.name" class="p-2 rounded-2xl" />
      <h3 class="font-display tracking-tight text-3xl">{{ p.name }}</h3>
      <p class="text-3xl">{{ p.price | currency }}</p>
      <p>{{ p.description }}</p>
      <p>{{ 'In stock - ' + p.stock + ' left' }}</p>
      <button
        (click)="onAddToCart(p, 1)"
        class="hover:text-vibe-accent mb-10 border-vibe-accent border-2 rounded-2xl p-2 shadow-2xl hover:scale-105 transition-transform duration-200"
      >
        {{ justAddedId() === p.id ? 'Added' : 'Add to cart' }}
      </button>
    } @else {
      <p>Loading...</p>
    }
  </div>

  <strong class="flex justify-center text-3xl font-display m-4 font-bold">Similar products</strong>
  <div class="relative w-full px-2">
    <button
      (click)="prev()"
      [disabled]="!goPrev()"
      class="absolute left-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-vibe-ink/80 text-vibe-bg disabled:opacity-30 disabled:cursor-not-allowed"
    >
      ‹
    </button>

    <div class="flex flex-row gap-4 overflow-hidden">
      @for (p of visableProducts(); track p.id) {
        <div class="flex flex-col shrink-0 w-36 sm:w-1/2 lg:w-1/3">
          <a [routerLink]="['/products', p.id + '-' + slug(p.name)]">
            <img
              [src]="p.image_url"
              [alt]="p.name"
              class="w-full aspect-square object-cover sm:aspect-4/3 rounded-xl"
            />
            <p class="truncate">{{ p.name }}</p>
            <p>{{ p.price | currency }}</p>
          </a>
        </div>
      }
    </div>

    <button
      (click)="next()"
      [disabled]="!goNext()"
      class="absolute right-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-vibe-ink/80 text-vibe-bg disabled:opacity-30 disabled:cursor-not-allowed"
    >
      ›
    </button>
  </div>
</main>

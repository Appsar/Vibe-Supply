<div class="flex ml-2 mt-2 mb-4">
  <a
    [routerLink]="['/admin']"
    class="font-bold hover:bg-fuchsia-200 border-2 rounded-2xl p-1 sm:p-2 sm:text-2xl"
    ><-Back to product list</a
  >
</div>

<h1 class="flex justify-center text-3xl font-medium mb-4">Add new product</h1>
<form [formGroup]="addProductForm" (ngSubmit)="onSubmit()" class="flex flex-col items-center gap-5">
  <label class="flex flex-col gap-1 font-medium">
    Name
    <input formControlName="name" class="border-2 rounded-lg p-2 w-full" />
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Description
    <textarea formControlName="description" class="border-2 rounded-lg p-2 w-full"></textarea>
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Price
    <input formControlName="price" class="border-2 rounded-lg p-2 w-full" />
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Image URL
    <input formControlName="image_url" class="border-2 rounded-lg p-2 w-full" />
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >STOCK
    <input formControlName="stock" class="border-2 rounded-lg p-2 w-full" />
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >SKU
    <input
      type="text"
      formControlName="sku"
      pattern="[A-Z]{3}[0-9]{3}"
      required
      title="Format: 3 bokstäver (A-Z) följt av 3 siffror, t.ex. ABC123"
      class="border-2 rounded-lg p-2"
    />
  </label>
  <button
    type="submit"
    [disabled]="addProductForm.invalid"
    class="border-2 w-fit p-2 rounded-2xl disabled:opacity-40 disabled:cursor-not-allowed"
  >
    Add product
  </button>
</form>

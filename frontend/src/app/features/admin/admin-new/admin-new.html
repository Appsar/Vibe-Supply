<div class="flex ml-2 mt-2 mb-4">
  <a
    [routerLink]="['/admin']"
    class="hover:border-vibe-accent font-display transition-colors border-2 rounded-2xl p-1 sm:p-2 sm:text-2xl"
    ><-Back to product list</a
  >
</div>

<h1 class="flex justify-center text-3xl font-medium mb-4">Add new product</h1>
<form [formGroup]="addProductForm" (ngSubmit)="onSubmit()" class="flex flex-col items-center gap-5">
  <label class="flex flex-col gap-1 font-medium">
    Name
    <input
      formControlName="name"
      class="border-2 rounded-lg p-2 w-full"
      placeholder="Title of product"
    />
    @if (hasError('name', 'required')) {
      <span class="text-red-500 text-center">Name is required</span>
    }
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Description
    <textarea
      formControlName="description"
      class="border-2 rounded-lg p-2 w-full"
      placeholder="Description of the product"
    ></textarea>
    @if (hasError('description', 'required')) {
      <span class="text-red-500 text-center">Description is required</span>
    }
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Price
    <input
      formControlName="price"
      class="border-2 rounded-lg p-2 w-full"
      placeholder="Enter price with numbers"
    />
    @if (hasError('price', 'required') || hasError('price', 'min')) {
      <span class="text-red-500 text-center">
        @if (hasError('price', 'required')) {
          Price is required.
        } @else if (hasError('price', 'min')) {
          Price must be greater than 0.
        }
      </span>
    }
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >Image URL
    <input
      formControlName="image_url"
      class="border-2 rounded-lg p-2 w-full"
      placeholder="Link to image"
    />
    @if (hasError('image_url', 'required')) {
      <span class="text-red-500 text-center">Image url is required.</span>
    }
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >STOCK
    <input
      formControlName="stock"
      class="border-2 rounded-lg p-2 w-full"
      placeholder="Enter stock with numbers"
    />
    @if (hasError('stock', 'required') || hasError('stock', 'min')) {
      <span class="text-red-500 text-center">
        @if (hasError('stock', 'required')) {
          Stock is required.
        } @else if (hasError('stock', 'min')) {
          Stock cannot be negative.
        }
      </span>
    }
  </label>
  <label class="flex flex-col gap-1 font-medium"
    >SKU
    <input
      type="text"
      formControlName="sku"
      pattern="[A-Z]{3}[0-9]{3}"
      required
      title="Format: 3 bokstäver (A-Z) följt av 3 siffror, t.ex. ABC123"
      class="border-2 rounded-lg p-2"
      placeholder="(e.g, ABC123)"
    />
  </label>
  @if (hasError('sku', 'required') || hasError('sku', 'pattern')) {
    <span class="text-red-500 text-center">
      @if (hasError('sku', 'required')) {
        SKU is required
      } @else if (hasError('sku', 'pattern')) {
        SKU must be 3 CAPITAL letters followed by 3 numbers ("ABC123")
      }
    </span>
  }

  <button
    type="submit"
    [disabled]="addProductForm.invalid"
    class="border-2 w-fit p-2 rounded-2xl disabled:opacity-40 disabled:cursor-not-allowed"
  >
    Add product
  </button>
</form>

<div class="flex justify-between">
  <h1 class="text-2xl ml-5 font-medium">Products</h1>
  <a
    [routerLink]="['/admin/new']"
    class="mr-10 border-2 rounded-2xl p-1 font-medium hover:bg-fuchsia-200"
    >New Product +</a
  >
</div>

<table class="w-full border-collapse">
  <thead>
    <tr class="border-b-2 text-left">
      <th>Name</th>
      <th>Price</th>
      <th>Description</th>
      <th>Stock</th>
    </tr>
  </thead>
  <tbody class="border-b">
    @for (p of products(); track p.id) {
      <tr>
        <td>
          <a class="hover:underline" [routerLink]="['/products/', p.id]">{{ p.name }}</a>
        </td>
        <td>{{ p.price | currency }}</td>
        <td>{{ p.description }}</td>
        <td>{{ p.stock }}</td>
        <td>
          <button (click)="onDelete(p.id)">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#000000"
            >
              <path
                d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"
              />
            </svg>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>

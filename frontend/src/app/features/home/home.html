<div class="flex flex-col justify-center items-center">
  <main
    class="flex flex-col bg-linear-to-r from-vibe-accent to-orange-200 lg:p-5 lg:m-5 lg:flex-row m-2 mb-5 p-2 text-center border-2 border-vibe-accent rounded-xl"
  >
    <img src="images/Hero.png" alt="Vibe Supply Hero" />
    <div class="flex flex-col justify-center gap-3 p-4">
      <h1 class="font-display text-3xl lg:text-4xl">Your vibe. Your supply.</h1>
      <p class="text-lg">
        Quality streetwear without the noise. New drops, honest pricing, and pieces made to actually
        get worn.
      </p>
    </div>
  </main>
  <h2 class="text-3xl font-bold mb-5 underline">Popular Products</h2>
  <div class="gap-10 grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 text-2xl">
    @for (p of products().slice(0, 8); track p.id) {
      <div class="relative">
        @if (isNew(p.created_at)) {
          <span
            class="absolute top-2 left-2 bg-vibe-accent text-vibe-bg text-xs font-bold px-2 py-1"
          >
            Nyhet
          </span>
        }
        <div class="aspect-square overflow-hidden bg-vibe-border mb-3">
          <img [src]="p.image_url" [alt]="p.name" class="w-full h-full object-cover" />
        </div>
        <h3 class="truncate">{{ p.name }}</h3>
        <p>{{ p.price | currency }}</p>
        <div class="flex items-center gap-3 justify-between">
          <a
            [routerLink]="['/products', p.id + '-' + slug(p.name)]"
            class="text-sm underline hover:text-vibe-accent transition-colors"
          >
            More details
          </a>
          <button
            (click)="onAddToCart(p, 1)"
            class="bg-vibe-ink text-vibe-bg px-4 py-1.5 text-sm font-medium hover:bg-vibe-accent transition-colors"
          >
            {{ justAddedId() === p.id ? 'Added' : 'Add to cart' }}
          </button>
        </div>
      </div>
    }
  </div>
</div>

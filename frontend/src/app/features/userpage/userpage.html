<div class="min-h-[60vh] flex items-center justify-center px-4">

  >
    <div
      class="w-16 h-16 rounded-full bg-fuchsia-100 flex items-center justify-center text-vibe-accent"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.5"
        stroke="currentColor"
        class="w-8 h-8"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />

    <h1 class="text-3xl font-display font-medium tracking-tight">Logged in</h1>
    <a

  </div>

<div class="flex justify-center mb-5 text-3xl">
  <h2>Login PAGE</h2>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col items-center gap-5">
  <label
    >Email:
    <input type="email" formControlName="email" class="border-2 rounded-lg p-2" />
  </label>

  <label
    >Password:
    <input type="password" formControlName="password" class="border-2 rounded-lg p-2" />
  </label>

  @if (errorMessage()) {
    <p class="text-red-500">{{ errorMessage() }}</p>
  }

  <button
    type="submit"
    [disabled]="loginForm.invalid"
    class="border-2 w-fit p-2 rounded-2xl disabled:opacity-40 disabled:cursor-not-allowed"
  >
    Login
  </button>
</form>

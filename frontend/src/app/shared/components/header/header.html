<nav class="flex items-center justify-between px-8 py-5 border-b-2 border-vibe-border">
  <a
    routerLink="/"
    class="font-display text-2xl tracking-tight hover:text-vibe-accent transition-colors"
    >VIBE SUPPLY</a
  >

  <div class="flex items-center gap-6 flex-1 justify-center max-w-md">
    <a routerLink="/products" class="hover:text-vibe-accent transition-colors">Shop</a>
    <input
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
      placeholder="Search for item here..."
      class="border-2 border-vibe-ink rounded-full px-4 py-1.5 flex-1 focus:outline-none focus:border-vibe-accent"
    />
  </div>

  <div class="flex items-center gap-6">
    @if (isLoggedIn()) {
      <a routerLink="/user" class="hover:text-vibe-accent transition-colors">Account</a>
      <button (click)="logout()" class="hover:text-vibe-accent transition-colors">Log Out</button>
    } @else {
      <a routerLink="/login" class="hover:text-vibe-accent transition-colors">Login</a>
    }
    <a routerLink="/cart" class="hover:text-vibe-accent transition-colors">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="40px"
        viewBox="0 -960 960 960"
        width="40px"
        fill="#000000"
      >
        <path
          d="M223.5-103.5Q200-127 200-160t23.5-56.5Q247-240 280-240t56.5 23.5Q360-193 360-160t-23.5 56.5Q313-80 280-80t-56.5-23.5Zm400 0Q600-127 600-160t23.5-56.5Q647-240 680-240t56.5 23.5Q760-193 760-160t-23.5 56.5Q713-80 680-80t-56.5-23.5ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Zm134 280h280-280Z"
        /></svg
    ></a>
  </div>
</nav>
